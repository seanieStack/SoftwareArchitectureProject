services:
  core-db:
    image: postgres:17
    environment:
      POSTGRES_USER: ${CORE_DB_USER}
      POSTGRES_PASSWORD: ${CORE_DB_PASSWORD}
      POSTGRES_DB: ${CORE_DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - core-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${CORE_DB_USER} -d ${CORE_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  support-db:
    image: postgres:17
    environment:
      POSTGRES_USER: ${SUPPORT_DB_USER}
      POSTGRES_PASSWORD: ${SUPPORT_DB_PASSWORD}
      POSTGRES_DB: ${SUPPORT_DB_NAME}
    ports:
      - "5433:5432"
    volumes:
      - support-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SUPPORT_DB_USER} -d ${SUPPORT_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:4-management
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 30s
      retries: 12
      start_period: 90s

  eureka-server:
    build: ./backend/eureka-server
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8761/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  config-service:
    build: ./backend/config-service
    ports:
      - "8888:8888"
    environment:
      EUREKA_URI: http://eureka-server:8761/eureka/
    volumes:
      - ${HOME}/config-repo:/root/config-repo
    depends_on:
      eureka-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8888/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  core-service:
    build: ./backend/core-service
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://core-db:5432/${CORE_DB_NAME}
      SPRING_DATASOURCE_USERNAME: ${CORE_DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${CORE_DB_PASSWORD}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      EUREKA_URI: http://eureka-server:8761/eureka/
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://localhost:5173}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      core-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8081/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  support-service:
    build: ./backend/support-service
    ports:
      - "8082:8082"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://support-db:5432/${SUPPORT_DB_NAME}
      SPRING_DATASOURCE_USERNAME: ${SUPPORT_DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${SUPPORT_DB_PASSWORD}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      CORE_SERVICE_URL: http://core-service:8081
      EUREKA_URI: http://eureka-server:8761/eureka/
    depends_on:
      support-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      core-service:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8082/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  api-gateway:
    build: ./backend/api-gateway
    ports:
      - "8080:8080"
    environment:
      EUREKA_URI: http://eureka-server:8761/eureka/
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      eureka-server:
        condition: service_healthy
      core-service:
        condition: service_healthy
      support-service:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      # Vite proxies /api → gateway (same-origin in the browser; avoids CORS).
      VITE_PROXY_TARGET: http://api-gateway:8080
    depends_on:
      - api-gateway

volumes:
  core-db-data:
  support-db-data:
