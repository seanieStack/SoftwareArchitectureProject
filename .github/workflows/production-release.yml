name: E-Library Production CI/CD

on:
  push:
    branches: ["main"]

env:
  DOCKER_ORG: ${{ secrets.DOCKER_USERNAME }}

jobs:
  # ============================================================
  # JOB 1: BUILD ALL BACKEND SERVICES IN PARALLEL (MATRIX)
  # ============================================================
  build-backends:
    name: Build & Push ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true   # If one service fails, cancel the others immediately
      matrix:
        service:
          - eureka-server
          - config-service
          - core-service
          - support-service
          - api-gateway

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven

      - name: Run Tests — ${{ matrix.service }}
        run: |
          cd backend/${{ matrix.service }}
          chmod +x mvnw
          ./mvnw test

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up QEMU for multi-arch builds
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & Push Docker Image — ${{ matrix.service }}
        uses: docker/build-push-action@v5
        with:
          context: ./backend/${{ matrix.service }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.DOCKER_ORG }}/elibrary-${{ matrix.service }}:latest
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  # ============================================================
  # JOB 2: BUILD FRONTEND
  # ============================================================
  build-frontend:
    name: Build & Push React Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up QEMU for multi-arch builds
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & Push Docker Image — frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.DOCKER_ORG }}/elibrary-frontend:latest
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  # ============================================================
  # JOB 3: DEPLOY TO ORACLE CLOUD VM
  # Runs only after BOTH build jobs succeed
  # ============================================================
  deploy-to-prod:
    name: Deploy to Oracle Cloud VPS
    needs: [build-backends, build-frontend]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Copy Compose File to Server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.PROD_SERVER_IP }}
          username: ${{ secrets.PROD_SERVER_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          source: "docker-compose.prod.yml"
          target: "/opt/elibrary"

      - name: Deploy on Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_SERVER_IP }}
          username: ${{ secrets.PROD_SERVER_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            set -e
            echo "=== Connected to Production Server ==="
            cd /opt/elibrary

            # Inject runtime secrets into the environment file
            cat > .env <<EOF
            DOCKER_ORG=${{ secrets.DOCKER_USERNAME }}
            CORE_DB_USER=${{ secrets.CORE_DB_USER }}
            CORE_DB_PASSWORD=${{ secrets.CORE_DB_PASSWORD }}
            CORE_DB_NAME=${{ secrets.CORE_DB_NAME }}
            SUPPORT_DB_USER=${{ secrets.SUPPORT_DB_USER }}
            SUPPORT_DB_PASSWORD=${{ secrets.SUPPORT_DB_PASSWORD }}
            SUPPORT_DB_NAME=${{ secrets.SUPPORT_DB_NAME }}
            RABBITMQ_USER=${{ secrets.RABBITMQ_USER }}
            RABBITMQ_PASSWORD=${{ secrets.RABBITMQ_PASSWORD }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            INTERNAL_SECRET=${{ secrets.INTERNAL_SECRET }}
            FRONTEND_BASE_URL=${{ secrets.FRONTEND_BASE_URL }}
            EOF

            # Pull the latest images we just pushed
            docker compose -f docker-compose.prod.yml pull

            # Recreate only changed containers; leave databases untouched
            docker compose -f docker-compose.prod.yml up -d --remove-orphans

            # Remove dangling images to prevent disk fill-up
            docker image prune -f

            echo "=== Deployment Complete ==="
