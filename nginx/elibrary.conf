# ─── HTTP → HTTPS redirect (applies to all server names) ─────────────────────
server {
    listen 80;
    server_name elibrary.example.com api.elibrary.example.com;

    # Certbot will place its ACME challenge files here during certificate renewal
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ─── Frontend (React SPA) ─────────────────────────────────────────────────────
server {
    listen 443 ssl;
    server_name elibrary.example.com;

    ssl_certificate     /etc/letsencrypt/live/elibrary.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/elibrary.example.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        proxy_pass         http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}

# ─── API Gateway ──────────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    server_name api.elibrary.example.com;

    ssl_certificate     /etc/letsencrypt/live/elibrary.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/elibrary.example.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;

    location / {
        proxy_pass         http://localhost:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Raise timeouts for long-running API requests
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }
}
