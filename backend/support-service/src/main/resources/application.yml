server:
  port: 8082

spring:
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  application:
    name: support-service
  config:
    import: optional:configserver:${CONFIG_SERVER_URI:http://localhost:8888}
  datasource:
    url: jdbc:postgresql://localhost:5433/support
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    defer-datasource-initialization: true
  sql:
    init:
      mode: always
      data-locations: classpath:seed.sql
  rabbitmq:
    host: localhost
    port: 5672
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}

internal:
  secret: ${INTERNAL_SECRET:dev-internal-secret-change-me}

core-service:
  url: ${CORE_SERVICE_URL:http://localhost:8081}
  connect-timeout: ${CORE_SERVICE_CONNECT_TIMEOUT:2s}
  read-timeout: ${CORE_SERVICE_READ_TIMEOUT:2s}
  retry-max-attempts: ${CORE_SERVICE_RETRY_MAX_ATTEMPTS:3}
  retry-wait-duration: ${CORE_SERVICE_RETRY_WAIT_DURATION:200ms}
  circuit-breaker-failure-rate-threshold: ${CORE_SERVICE_CB_FAILURE_RATE_THRESHOLD:50}
  circuit-breaker-sliding-window-size: ${CORE_SERVICE_CB_SLIDING_WINDOW_SIZE:4}
  circuit-breaker-minimum-number-of-calls: ${CORE_SERVICE_CB_MINIMUM_CALLS:2}
  circuit-breaker-wait-duration-in-open-state: ${CORE_SERVICE_CB_WAIT_OPEN:5s}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

logging:
  level:
    root: INFO
    io.github.seaniestack.supportservice: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
