spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

spring.datasource.url=jdbc:h2:mem:support-service-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

spring.config.import=
eureka.client.enabled=false
spring.cloud.discovery.enabled=false

spring.rabbitmq.listener.simple.auto-startup=false
spring.rabbitmq.listener.direct.auto-startup=false

core-service.url=http://localhost:8081
core-service.connect-timeout=200ms
core-service.read-timeout=200ms
core-service.retry-max-attempts=3
core-service.retry-wait-duration=10ms
core-service.circuit-breaker-failure-rate-threshold=50
core-service.circuit-breaker-sliding-window-size=4
core-service.circuit-breaker-minimum-number-of-calls=2
core-service.circuit-breaker-wait-duration-in-open-state=5s
