server:
  port: 8888

spring:
  application:
    name: config-server
  cloud:
    config:
      server:
        git:
          uri: https://github.com/seanieStack/SoftwareArchitectureProject
          default-label: main
          clone-on-start: true
          search-paths: backend/config-service/src/main/resources/config

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true