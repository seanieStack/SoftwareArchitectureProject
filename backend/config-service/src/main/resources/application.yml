server:
  port: 8888

spring:
  application:
    name: config-server
  profiles:
    # "native" uses bundled classpath files (works offline / Docker).
    # Override to "git" when running with internet access to use the GitHub backend.
    active: ${SPRING_PROFILES_ACTIVE:native}
  cloud:
    config:
      server:
        native:
          search-locations: classpath:/config/
        git:
          uri: https://github.com/seanieStack/SoftwareArchitectureProject
          default-label: main
          clone-on-start: true
          search-paths: backend/config-service/src/main/resources/config

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true
