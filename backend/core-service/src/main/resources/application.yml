server:
  port: 8081

spring:
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  application:
    name: core-service
  config:
    import: optional:configserver:${CONFIG_SERVER_URI:http://localhost:8888}
  datasource:
    url: jdbc:postgresql://localhost:5432/${CORE_DB_NAME}
    username: ${CORE_DB_USER}
    password: ${CORE_DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    defer-datasource-initialization: true
  sql:
    init:
      mode: always
      data-locations: classpath:seed.sql
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER}
    password: ${RABBITMQ_PASSWORD}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

jwt:
  secret: ${JWT_SECRET:local-dev-only-change-me-please-use-a-long-random-secret-key-at-least-32-chars}
  expiration-ms: ${JWT_EXPIRATION_MS:3600000}

refresh-token:
  expiration-ms: ${REFRESH_TOKEN_EXPIRATION_MS:604800000}

internal:
  secret: ${INTERNAL_SECRET:dev-internal-secret-change-me}

app:
  password-reset:
    frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:5173}
    token-expiration-ms: ${PASSWORD_RESET_TOKEN_EXPIRATION_MS:3600000}
    mail-from: ${PASSWORD_RESET_MAIL_FROM:}
