spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

spring.datasource.url=jdbc:h2:mem:core-service-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

jwt.secret=test-secret-must-be-at-least-256-bits-long-for-hs256-algorithm-xx
jwt.expiration-ms=3600000

eureka.client.enabled=false
spring.cloud.discovery.enabled=false

# Refresh token
refresh-token.expiration-ms=86400000

# Password reset
app.password-reset.token-expiration-ms=3600000
app.password-reset.frontend-base-url=http://localhost:5173
app.password-reset.mail-from=noreply@test.com

# Internal secret
internal.secret=test-internal-secret

# Support service client (bean needs this value to construct)
support-service.url=http://localhost:8082

# Disable Config Server
spring.config.import=optional:configserver:
spring.cloud.config.enabled=false
spring.sql.init.mode=never